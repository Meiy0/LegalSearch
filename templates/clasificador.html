{% extends "base.html" %}

{% block title %}Clasificador de Documentos - LegalSearch{% endblock %}

{% block content %}
<h1>Clasificador de Documentos</h1>
<p>Suba múltiples documentos PDF y haga una búsqueda por palabra o frase exacta.</p>

<div class="panel" id="main-panel">

    <form id="searchForm" enctype="multipart/form-data">
        <label for="pdfFile">Paso 1: Seleccione uno o más archivos PDF:</label>
        <input type="file" id="pdfFile" name="file" accept=".pdf" required multiple>

        <label for="queryInput">Paso 2: Ingrese su búsqueda:</label>
        <input type="text" id="queryInput" name="query" placeholder="Ej: sistema informático" required>

        <button type="submit" id="submitButton">Buscar en documentos</button>
    </form>

    <div id="resultsContainer">
        <p class="info-message">Seleccione sus PDFs y realice una búsqueda.</p>
    </div>

</div>

<script src="{{ url_for('static', filename='clasificador.js') }}"></script>
{% endblock %}
